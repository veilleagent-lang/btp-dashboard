<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Veille BTP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    max-width: 1400px;
    margin: 0 auto;
  }
  
  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1a1a 0%, #2d1b0e 50%, #ff6b00 100%);
    border-radius: 20px;
    padding: 50px;
    text-align: center;
    margin-bottom: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  
  .header::before {
    content: '🏗️';
    position: absolute;
    top: 20px;
    left: 40px;
    font-size: 80px;
    opacity: 0.1;
  }
  
  .header::after {
    content: '🏢';
    position: absolute;
    bottom: 20px;
    right: 40px;
    font-size: 80px;
    opacity: 0.1;
  }
  
  .logo {
    display: inline-block;
    background: linear-gradient(135deg, #d4af37 0%, #ff9d3d 100%);
    color: #1a1a1a;
    padding: 10px 25px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
  }
  
  h1 {
    color: white;
    font-size: 48px;
    font-weight: 900;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  
  .subtitle {
    color: #ff9d3d;
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  /* Stats Cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  
  .stat-card {
    background: white;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    border-left: 5px solid #ff6b00;
    transition: transform 0.3s;
  }
  
  .stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 30px rgba(255, 107, 0, 0.2);
  }
  
  .stat-icon {
    font-size: 40px;
    margin-bottom: 10px;
  }
  
  .stat-number {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(135deg, #1a1a1a 0%, #ff6b00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
  }
  
  .stat-label {
    color: #666;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  /* Table Container */
  .table-container {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    margin-bottom: 30px;
  }
  
  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 3px solid #ff6b00;
  }
  
  .table-title {
    font-size: 28px;
    font-weight: 900;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .refresh-btn {
    background: linear-gradient(135deg, #ff6b00 0%, #ff9d3d 100%);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
    transition: all 0.3s;
  }
  
  .refresh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
  }
  
  /* Search Bar */
  .search-container {
    margin-bottom: 25px;
  }
  
  .search-input {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    transition: border 0.3s;
  }
  
  .search-input:focus {
    outline: none;
    border-color: #ff6b00;
  }
  
  /* Filter Buttons */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }
  
  .filter-btn {
    padding: 10px 20px;
    border: 2px solid #e0e0e0;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.3s;
  }
  
  .filter-btn.active {
    background: linear-gradient(135deg, #ff6b00 0%, #ff9d3d 100%);
    color: white;
    border-color: #ff6b00;
  }
  
  .filter-btn:hover {
    border-color: #ff6b00;
  }
  
  /* Table */
  .opportunities-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  
  .opportunities-table thead {
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
  }
  
  .opportunities-table th {
    color: #ff9d3d;
    padding: 18px 15px;
    text-align: left;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-bottom: 3px solid #ff6b00;
  }
  
  .opportunities-table th:first-child {
    border-top-left-radius: 12px;
  }
  
  .opportunities-table th:last-child {
    border-top-right-radius: 12px;
  }
  
  .opportunities-table tbody tr {
    transition: all 0.3s;
    border-bottom: 1px solid #f0f0f0;
  }
  
  .opportunities-table tbody tr:hover {
    background: #fff5eb;
    transform: translateX(5px);
    box-shadow: -5px 0 0 0 #ff6b00;
  }
  
  .opportunities-table td {
    padding: 20px 15px;
  }
  
  .source-badge {
    display: inline-block;
    padding: 6px 14px;
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    color: #ff9d3d;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .source-badge::before {
    content: '📡 ';
  }
  
  .opportunity-title {
    font-weight: 700;
    color: #1a1a1a;
    font-size: 15px;
    margin-bottom: 5px;
  }
  
  .opportunity-title::before {
    content: '🏗️ ';
    margin-right: 5px;
  }
  
  .opportunity-desc {
    color: #666;
    font-size: 13px;
    line-height: 1.5;
  }
  
  .type-badge {
    display: inline-block;
    padding: 6px 12px;
    background: linear-gradient(135deg, #fff5eb 0%, #ffe5d4 100%);
    color: #ff6b00;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid rgba(255, 107, 0, 0.3);
  }
  
  .action-btn {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b00 0%, #ff9d3d 100%);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3);
    transition: all 0.3s;
  }
  
  .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 107, 0, 0.4);
  }
  
  /* Loading */
  .loading {
    text-align: center;
    padding: 60px;
    color: #666;
    font-size: 18px;
  }
  
  .spinner {
    display: inline-block;
    width: 50px;
    height: 50px;
    border: 5px solid #f0f0f0;
    border-top: 5px solid #ff6b00;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  /* Footer */
  .footer {
    text-align: center;
    padding: 30px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
  }
  
  .footer-logo {
    font-weight: 900;
    color: #ff9d3d;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  
  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 30px 20px; }
    h1 { font-size: 32px; }
    .table-container { padding: 20px; }
    .opportunities-table { font-size: 13px; }
    .opportunities-table td { padding: 15px 10px; }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <div class="header">
    <div class="logo">🏗️ VEILLE PRO BTP</div>
    <h1>Tableau de Bord</h1>
    <p class="subtitle">Intelligence des Opportunités BTP</p>
  </div>
  
  <!-- Stats Cards -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-number" id="totalOpp">-</div>
      <div class="stat-label">Opportunités</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔍</div>
      <div class="stat-number">3</div>
      <div class="stat-label">Sources Actives</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⚡</div>
      <div class="stat-number" id="todayOpp">-</div>
      <div class="stat-label">Aujourd'hui</div>
    </div>
  </div>
  
  <!-- Table Container -->
  <div class="table-container">
    <div class="table-header">
      <h2 class="table-title">
        <span>✅</span>
        <span>Opportunités Récentes</span>
      </h2>
      <button class="refresh-btn" onclick="loadData()">
        <span>🔄</span>
        <span>Actualiser</span>
      </button>
    </div>
    
    <!-- Search -->
    <div class="search-container">
      <input 
        type="text" 
        class="search-input" 
        id="searchInput"
        placeholder="🔍 Rechercher une opportunité..."
        onkeyup="filterTable()"
      >
    </div>
    
    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="filterSource('all')">Toutes</button>
      <button class="filter-btn" onclick="filterSource('Batiweb')">📡 Batiweb</button>
      <button class="filter-btn" onclick="filterSource('Le Moniteur')">📡 Le Moniteur</button>
      <button class="filter-btn" onclick="filterSource('BOAMP')">📡 BOAMP</button>
    </div>
    
    <!-- Loading -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Chargement des opportunités...</div>
    </div>
    
    <!-- Table -->
    <div id="tableWrapper" style="display: none;">
      <table class="opportunities-table">
        <thead>
          <tr>
            <th style="width: 12%;">Date</th>
            <th style="width: 13%;">Source</th>
            <th style="width: 40%;">Opportunité</th>
            <th style="width: 15%;">Type</th>
            <th style="width: 20%; text-align: center;">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Données chargées ici -->
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    <div class="footer-logo">🏗️ INTELLIGENCE BTP</div>
    <div>Surveillance automatisée · Batiweb · Le Moniteur · BOAMP</div>
  </div>
  
</div>

<script>
// CONFIGURATION : Remplacez par votre URL CSV du Google Sheet
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTTElPBlUK4iKa7uYFE5aQHa3owf6YFletn0DwhIvpjtsVeSnUaYmCbVc-zkrETHKbnpNBZ4oJnKEkQ/pub?gid=0&single=true&output=csv';

let allData = [];
let currentFilter = 'all';

// Charger les données
async function loadData() {
  try {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tableWrapper').style.display = 'none';
    
    const response = await fetch(SHEET_CSV_URL);
    const csvText = await response.text();
    
    // Parser CSV
    const rows = csvText.split('\n').slice(1); // Skip header
    allData = rows
      .filter(row => row.trim())
      .map(row => {
        const cols = row.split(',');
        return {
          date: cols[0] || '',
          heure: cols[1] || '',
          source: cols[2] || '',
          titre: cols[3] || '',
          type: cols[4] || '',
          lien: cols[5] || '',
          description: cols[6] || ''
        };
      });
    
    // Mettre à jour les stats
    document.getElementById('totalOpp').textContent = allData.length;
    
    const today = new Date().toLocaleDateString('fr-FR');
    const todayCount = allData.filter(item => item.date.includes(today.split('/').reverse().join('/'))).length;
    document.getElementById('todayOpp').textContent = todayCount;
    
    // Afficher les données
    displayData(allData);
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tableWrapper').style.display = 'block';
    
  } catch (error) {
    console.error('Erreur:', error);
    document.getElementById('loading').innerHTML = '❌ Erreur de chargement. Vérifiez l\'URL du Google Sheet.';
  }
}

// Afficher les données dans le tableau
function displayData(data) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  data.forEach(item => {
    const row = `
      <tr data-source="${item.source}">
        <td>${item.date}<br><small style="color: #999;">${item.heure}</small></td>
        <td><span class="source-badge">${item.source}</span></td>
        <td>
          <div class="opportunity-title">${item.titre}</div>
          <div class="opportunity-desc">${item.description.substring(0, 150)}...</div>
        </td>
        <td><span class="type-badge">${item.type}</span></td>
        <td style="text-align: center;">
          <a href="${item.lien}" target="_blank" class="action-btn">Consulter →</a>
        </td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

// Filtrer par source
function filterSource(source) {
  currentFilter = source;
  
  // Mettre à jour les boutons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  // Filtrer et afficher
  const filtered = source === 'all' 
    ? allData 
    : allData.filter(item => item.source === source);
  
  displayData(filtered);
}

// Recherche dans le tableau
function filterTable() {
  const input = document.getElementById('searchInput');
  const filter = input.value.toLowerCase();
  const rows = document.querySelectorAll('#tableBody tr');
  
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(filter) ? '' : 'none';
  });
}

// Charger les données au démarrage
loadData();

// Auto-refresh toutes les 5 minutes
setInterval(loadData, 300000);
</script>

</body>
</html>
